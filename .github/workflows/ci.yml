name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: fmt, clippy, test, SPA, plug-in feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System packages (wry, cpal, nih-plug)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libasound2-dev             libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev             libgl1-mesa-dev libjack-jackd2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test

      - name: Build the SPA (the plug-in embeds web/dist)
        working-directory: web
        run: npm install && npm run build

      - name: Plug-in feature
        run: |
          cargo check --features plugin
          cargo check --features plugin --release

  windows:
    name: plug-in feature (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the SPA
        working-directory: web
        run: npm install && npm run build
      - name: Plug-in feature
        run: cargo check --features plugin --release
