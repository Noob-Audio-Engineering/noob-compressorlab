[package]
name = "noob-compressorlab"
description = "Noob CompressorLab, a free plug-in with an 1176-style FET compressor and an LA-2A-style optical compressor behind one model switch, whose editor is the OS web view rendering a Vue + Tailwind SPA over noob-vst-webgui-framework"
readme = "README.md"
version = "0.1.0"
authors = ["Ely Erin Fox"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Noob-Audio-Engineering/noob-compressorlab"
homepage = "https://github.com/Noob-Audio-Engineering/noob-compressorlab"
# A plug-in, not a library: nothing here goes to crates.io.
publish = false


# How this plug-in presents itself in the plug-in manager. It lives here so
# each plug-in owns its own description --- the manager has no list of them.
[package.metadata.noob]
kind = "effect"
name = "Noob CompressorLab"
accent = "#e2657a"
tagline = "Eleven classic compressors behind one control, each modelled from its own sourced dossier."
features = [
    "Eleven models: FET, opto, VCA, variable-mu, diode bridge and more",
    "Each engine measured against published figures: 192 met across 487 rows",
    "The electrical parts are shared crates, so a photocell is one photocell",
    "Per-model faces that look identical where they share controls",
    "VU ballistics computed in the audio thread, one per needle",
]

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "noob-compressorlab-standalone"
path = "src/bin/standalone.rs"

# Measures every model against its research document's published figures and
# writes `docs/BENCHMARK.md`. A binary rather than a test, because it drives
# minutes of audio through six engines and `cargo test` should stay fast.
[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[features]
default = []
# Build the real VST3 / CLAP plugin (pulls nih-plug from git and embeds
# `web/dist`, so run `npm run build` in `web/` first). Without it the crate is
# just the DSP plus the standalone dev server.
plugin = ["dep:nih_plug", "dep:noob-vst-webgui-framework-nih", "dep:include_dir"]

[dependencies]
noob-vst-webgui-framework = { git = "https://github.com/Noob-Audio-Engineering/noob-vst-webgui-framework" }
# The photocell. Its T4 cell is shared by the two compressors that contain
# an actual T4B; its general half, the laws any photoresistor obeys, is
# shared by all three. See `src/dsp/opto/model.rs` and `src/dsp/opto1b/`.
# The remote-cutoff triode the variable-mu model runs on. See `src/dsp/vmu/mod.rs`.
# The FET the 1176 and the 6176 use as their gain element. See `src/dsp/fet/compressor.rs`.
noob-electrical-components = { git = "https://github.com/Noob-Audio-Engineering/noob-electrical-components", features = ["photocell", "diode-bridge", "remote-cutoff-triode", "fet-variable-resistor", "blackmer-cell", "log-rms-detector", "diode-arm-pair", "small-signal-triode", "transformer"] }
noob-vst-webgui-framework-nih = { git = "https://github.com/Noob-Audio-Engineering/noob-vst-webgui-framework", optional = true }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", optional = true }
include_dir = { version = "0.7", optional = true }
log = "0.4"
env_logger = "0.11"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# Host-driven editor resizing needs the patched nih-plug the framework is
# built against; Cargo only honours patches in the root manifest, so every
# plug-in repository carries this line.
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { git = "https://github.com/Noob-Audio-Engineering/nih-plug.git", branch = "host-resize" }
